# Otomatis: build APK Android + pasang halaman admin di GitHub Pages.
# Jalan setiap kali ada file yang di-upload/diubah, atau manual lewat tab Actions → Run workflow.
name: Build APK & Halaman Admin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Siapkan situs (halaman admin + APK)
        run: |
          mkdir -p site
          cp -r web/. site/
          cp android/app/build/outputs/apk/debug/app-debug.apk site/pengingat-sayang.apk
          touch site/.nojekyll

      - name: Simpan APK (cadangan, bisa diunduh dari halaman run ini)
        uses: actions/upload-artifact@v4
        with:
          name: pengingat-sayang-apk
          path: site/pengingat-sayang.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
