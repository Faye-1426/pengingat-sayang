plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pengingatsayang.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pengingatsayang.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Kunci tanda tangan tetap, supaya update aplikasi bisa langsung di-install
    // di atas versi lama tanpa harus uninstall dulu.
    signingConfigs {
        tetap {
            storeFile file('pengingat.keystore')
            storePassword 'android'
            keyAlias 'pengingat'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tetap
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tetap
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Hanya satu library: Firestore, untuk menerima perubahan pengingat secara langsung (realtime).
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-firestore'
}
